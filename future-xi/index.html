<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FUTURE XI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sticky compact nav, hash-routed views; editor = config | pitch | catalog (catalog becomes a bottom sheet under 1100px). */
:root {
  --bg: #090D0B;
  --panel: #151C18;
  --panel-2: #1B241F;
  --panel-3: #222D27;
  --line: rgba(244, 246, 243, .08);
  --line-2: rgba(244, 246, 243, .16);
  --neon: #B6FF55;
  --neon-soft: rgba(182, 255, 85, .14);
  --neon-ink: #0B1404;
  --fg: #F4F6F3;
  --muted: #A3ADA6;
  --dim: #6E7A72;
  --warn: #FFB547;
  --bad: #FF6B5E;
  --chalk: rgba(206, 255, 150, .26);
  --grass-a: #0E1912;
  --grass-b: #0B140E;
  --t-icono: #E9D7A1;
  --t-elite: #B6FF55;
  --t-oro: #D7B24A;
  --t-plata: #AEB9B2;
  --t-promesa: #6FE3D6;
  --font: "Manrope", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 12px;
  --r-sm: 8px;
  --shadow: 0 14px 40px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 70; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -.02em; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--neon); }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line-2);
  background: transparent; color: var(--fg); font-weight: 700; font-size: 14px; text-decoration: none;
  transition: background .18s, color .18s, border-color .18s, transform .18s, box-shadow .18s; white-space: nowrap;
}
.btn:hover { border-color: var(--neon); color: var(--neon); }
.btn.primary { background: var(--neon); color: var(--neon-ink); border-color: var(--neon); box-shadow: 0 0 0 0 rgba(182,255,85,0); }
.btn.primary:hover { background: #C9FF80; color: var(--neon-ink); box-shadow: 0 0 28px rgba(182,255,85,.28); }
.btn.ghost { border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); background: var(--panel-2); }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.btn.sm { padding: 6px 12px; font-size: 12.5px; }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn.block { width: 100%; }

/* Nav */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: rgba(9, 13, 11, .88); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.nav-in { display: flex; align-items: center; gap: 24px; height: 62px; }
.brand { display: flex; flex-direction: column; text-decoration: none; line-height: 1; }
.brand b { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
.brand b span { color: var(--neon); }
.brand small { font-size: 9px; font-weight: 700; letter-spacing: .26em; color: var(--dim); margin-top: 4px; }
.nav-links { display: flex; gap: 4px; margin-left: 12px; }
.nav-links a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14px; padding: 8px 12px; border-radius: 999px; transition: color .15s, background .15s; }
.nav-links a:hover { color: var(--fg); background: var(--panel); }
.nav-links a.on { color: var(--fg); background: var(--panel-2); }
.nav-cta { margin-left: auto; }
.burger { display: none; margin-left: auto; width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel); align-items: center; justify-content: center; }
.burger i, .burger i::before, .burger i::after { display: block; width: 18px; height: 2px; background: var(--fg); position: relative; border-radius: 2px; }
.burger i::before, .burger i::after { content: ""; position: absolute; left: 0; }
.burger i::before { top: -6px; } .burger i::after { top: 6px; }
.mobile-menu { display: none; border-top: 1px solid var(--line); padding-block: 10px 16px; }
.mobile-menu a { display: block; padding: 12px 4px; text-decoration: none; font-weight: 600; border-bottom: 1px solid var(--line); color: var(--muted); }
.mobile-menu a.on { color: var(--neon); }
.mobile-menu .btn { margin-top: 14px; width: 100%; }
@media (max-width: 900px) {
  .nav-links, .nav-cta { display: none; }
  .burger { display: inline-flex; }
  .nav.open .mobile-menu { display: block; }
}

main { padding-bottom: 80px; }
.view { animation: viewIn .28s ease both; }
@keyframes viewIn { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.page-head { padding-block: 36px 24px; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
.page-head h1 { font-size: clamp(28px, 4vw, 44px); font-weight: 800; }
.page-head p { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }

/* ---------- Pitch ---------- */
.pitch {
  position: relative; aspect-ratio: 68 / 92; width: 100%; border-radius: 14px; overflow: hidden;
  background:
    radial-gradient(60% 45% at 50% 50%, rgba(182,255,85,.10), transparent 70%),
    repeating-linear-gradient(180deg, var(--grass-a) 0 8.333%, var(--grass-b) 8.333% 16.666%);
  border: 1px solid var(--line-2);
  box-shadow: inset 0 0 80px rgba(0,0,0,.55), 0 20px 60px rgba(0,0,0,.4);
  container-type: inline-size;
}
.pl { position: absolute; inset: 3.5% 4.5%; border: 1px solid var(--chalk); pointer-events: none; }
.pl i { position: absolute; border: 1px solid var(--chalk); display: block; }
.pl .half { left: 0; right: 0; top: 50%; border-width: 1px 0 0; }
.pl .circ { left: 50%; top: 50%; width: 27%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); }
.pl .spot { left: 50%; top: 50%; width: 5px; height: 5px; border-radius: 50%; background: var(--chalk); transform: translate(-50%, -50%); border: 0; }
.pl .box { left: 21%; width: 58%; height: 16%; }
.pl .six { left: 36%; width: 28%; height: 6%; }
.pl .top { top: -1px; border-top: 0; } .pl .bot { bottom: -1px; border-bottom: 0; }
.pl .arc { left: 40%; width: 20%; height: 7%; border-radius: 50%; border-color: transparent; }
.pl .arc.top { top: 12.5%; border-bottom-color: var(--chalk); }
.pl .arc.bot { bottom: 12.5%; border-top-color: var(--chalk); }

.slot {
  --cw: 15cqw;
  position: absolute; transform: translate(-50%, -50%); background: none; border: 0; padding: 0;
  display: flex; flex-direction: column; align-items: center; gap: 3px; z-index: 2;
  transition: transform .2s;
}
.slot:hover { transform: translate(-50%, -50%) scale(1.04); z-index: 3; }
.slot-empty {
  width: calc(var(--cw) * .82); aspect-ratio: 3 / 4; border-radius: calc(var(--cw) * .1);
  border: 1.5px dashed rgba(244,246,243,.28); background: rgba(9,13,11,.45);
  display: grid; place-items: center; color: var(--muted); font-size: calc(var(--cw) * .32); font-weight: 300;
  transition: border-color .2s, background .2s, color .2s;
}
.slot:hover .slot-empty { border-color: var(--neon); color: var(--neon); }
.slot-pos {
  font-size: max(9px, calc(var(--cw) * .14)); font-weight: 800; letter-spacing: .06em; padding: 1px 6px; border-radius: 999px;
  background: rgba(9,13,11,.8); color: var(--muted); border: 1px solid var(--line);
}
.slot.active .slot-empty, .slot.active .card { outline: 2px solid var(--neon); outline-offset: 2px; box-shadow: 0 0 26px rgba(182,255,85,.45); }
.slot.active .slot-pos { color: var(--neon-ink); background: var(--neon); }
.slot.can-ok .slot-empty, .slot.can-ok .card { outline: 2px solid var(--neon); outline-offset: 2px; animation: pulse 1.4s ease-in-out infinite; }
.slot.can-adapt .slot-empty, .slot.can-adapt .card { outline: 1.5px dashed var(--warn); outline-offset: 2px; }
@keyframes pulse { 50% { box-shadow: 0 0 22px rgba(182,255,85,.5); } }
.slot-badge {
  position: absolute; top: calc(var(--cw) * -.08); right: calc(var(--cw) * -.1); width: max(16px, calc(var(--cw) * .28)); height: max(16px, calc(var(--cw) * .28));
  border-radius: 50%; display: grid; place-items: center; font-size: max(10px, calc(var(--cw) * .17)); font-weight: 800; z-index: 4;
}
.slot-badge.adapt { background: var(--warn); color: #241600; }
.slot-badge.off { background: var(--bad); color: #2A0905; }

/* ---------- Cards ---------- */
.card {
  --tc: var(--t-plata);
  position: relative; display: flex; flex-direction: column; overflow: hidden; text-align: left;
  background:
    linear-gradient(160deg, color-mix(in srgb, var(--tc) 16%, transparent), transparent 45%),
    linear-gradient(180deg, var(--panel-3), var(--panel));
  border: 1px solid color-mix(in srgb, var(--tc) 55%, transparent);
  border-radius: 12px; color: var(--fg);
  box-shadow: 0 8px 22px rgba(0,0,0,.35);
}
.card.t-icono { --tc: var(--t-icono); }
.card.t-elite { --tc: var(--t-elite); box-shadow: 0 8px 22px rgba(0,0,0,.35), 0 0 22px rgba(182,255,85,.12); }
.card.t-oro { --tc: var(--t-oro); }
.card.t-plata { --tc: var(--t-plata); }
.card.t-promesa { --tc: var(--t-promesa); }
.card .c-head { position: absolute; top: 0; left: 0; display: flex; flex-direction: column; align-items: center; line-height: 1; z-index: 2; }
.card .c-ovr { font-weight: 800; color: var(--tc); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.card .c-pos { font-weight: 800; letter-spacing: .06em; color: var(--fg); }
.card .c-nat { position: absolute; z-index: 2; font-weight: 800; letter-spacing: .08em; border: 1px solid var(--line-2); border-radius: 4px; color: var(--muted); }
.card .c-img { position: relative; display: flex; align-items: flex-end; justify-content: center; }
.card .c-img svg { height: 100%; width: auto; display: block; }
.card.era-L .c-img svg { filter: saturate(.35) sepia(.25) contrast(1.05); }
.card .c-name { font-weight: 800; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-top: 1px solid color-mix(in srgb, var(--tc) 35%, transparent); }
.card .c-foot { display: flex; justify-content: space-between; gap: 6px; color: var(--muted); font-weight: 600; }
.card .c-foot span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .c-tier { color: var(--tc); text-transform: uppercase; letter-spacing: .1em; }
.card .c-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px 8px; border-top: 1px solid var(--line); }
.card .c-stats span { display: flex; justify-content: space-between; color: var(--muted); font-size: 10.5px; font-weight: 600; }
.card .c-stats b { color: var(--fg); font-variant-numeric: tabular-nums; }

/* md card (catalog) */
.card.md { padding: 12px; }
.card.md .c-head { top: 12px; left: 12px; }
.card.md .c-ovr { font-size: 34px; }
.card.md .c-pos { font-size: 12px; margin-top: 2px; }
.card.md .c-nat { top: 12px; right: 12px; font-size: 10px; padding: 2px 5px; }
.card.md .c-img { height: 112px; margin-top: 6px; }
.card.md .c-name { font-size: 16px; padding-top: 8px; margin-top: 0; }
.card.md .c-foot { font-size: 11px; margin-top: 4px; }
.card.md .c-stats { margin-top: 10px; padding-top: 8px; }
/* sm card (pitch) */
.card.sm { width: var(--cw); padding: calc(var(--cw) * .06); border-radius: calc(var(--cw) * .1); box-shadow: 0 6px 16px rgba(0,0,0,.5); }
.card.sm .c-head { top: calc(var(--cw) * .05); left: calc(var(--cw) * .07); }
.card.sm .c-ovr { font-size: calc(var(--cw) * .27); }
.card.sm .c-pos { font-size: calc(var(--cw) * .12); }
.card.sm .c-nat { display: none; }
.card.sm .c-img { height: calc(var(--cw) * .66); margin-left: calc(var(--cw) * .18); }
.card.sm .c-name { font-size: max(9px, calc(var(--cw) * .16)); padding-top: calc(var(--cw) * .04); }
.card.sm .c-foot, .card.sm .c-stats { display: none; }
/* lg card (modal) */
.card.lg { width: 220px; padding: 16px; }
.card.lg .c-head { top: 16px; left: 16px; }
.card.lg .c-ovr { font-size: 52px; }
.card.lg .c-pos { font-size: 15px; margin-top: 4px; }
.card.lg .c-nat { top: 16px; right: 16px; font-size: 11px; padding: 2px 6px; }
.card.lg .c-img { height: 170px; margin-top: 10px; }
.card.lg .c-name { font-size: 20px; padding-top: 10px; }
.card.lg .c-foot { font-size: 12px; margin-top: 6px; }
.card.lg .c-stats { display: none; }

.card-btn { background: none; border: 0; padding: 0; text-align: left; border-radius: 12px; transition: transform .22s cubic-bezier(.2,.8,.2,1); }
.card-btn .card { height: 100%; transition: border-color .2s, box-shadow .2s; }
.card-btn:hover { transform: translateY(-4px); }
.card-btn:hover .card { border-color: var(--tc); box-shadow: 0 16px 36px rgba(0,0,0,.5), 0 0 30px color-mix(in srgb, var(--tc) 22%, transparent); }
.card-btn:active { transform: translateY(-1px) scale(.98); }

/* ---------- Home ---------- */
.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
.hero::before { content: ""; position: absolute; width: 760px; height: 760px; right: -160px; top: -200px; background: radial-gradient(closest-side, rgba(182,255,85,.13), transparent); pointer-events: none; }
.hero-in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 32px; align-items: center; padding-block: 56px 64px; position: relative; }
.hero h1 { font-size: clamp(38px, 6vw, 76px); font-weight: 800; line-height: .95; letter-spacing: -.04em; }
.hero h1 span { display: block; }
.hero h1 .hl { color: var(--neon); }
.hero h1 .ol { color: transparent; -webkit-text-stroke: 1.5px rgba(244,246,243,.55); }
.hero p.lead { font-size: 18px; color: var(--muted); max-width: 44ch; margin: 22px 0 28px; }
.hero-ctas { display: flex; flex-wrap: wrap; gap: 12px; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 36px; padding-top: 22px; border-top: 1px solid var(--line); }
.hero-meta div b { display: block; font-size: 22px; font-weight: 800; }
.hero-meta div span { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .12em; font-weight: 700; }
.stage { perspective: 1200px; perspective-origin: 50% 0%; display: flex; justify-content: center; padding-block: 10px 0; }
.stage-pitch {
  position: relative; width: min(100%, 470px); aspect-ratio: 68 / 92; transform: rotateX(40deg); transform-style: preserve-3d; transform-origin: 50% 60%;
  border-radius: 14px; border: 1px solid var(--line-2);
  background:
    radial-gradient(60% 45% at 50% 50%, rgba(182,255,85,.16), transparent 70%),
    repeating-linear-gradient(180deg, var(--grass-a) 0 8.333%, var(--grass-b) 8.333% 16.666%);
  box-shadow: 0 60px 90px rgba(0,0,0,.6), 0 0 120px rgba(182,255,85,.08);
  margin-top: -40px; margin-bottom: -70px;
}
.stage-pitch .floater { position: absolute; transform: translate(-50%, -96%) rotateX(-40deg); transform-origin: 50% 100%; --cw: clamp(46px, 6.2vw, 74px); }
.stage-pitch .floater > div { animation: float 4.5s ease-in-out infinite; }
.stage-pitch .floater .shadow { position: absolute; left: 50%; bottom: -6px; width: 70%; height: 10px; transform: translateX(-50%); background: radial-gradient(closest-side, rgba(0,0,0,.6), transparent); }
@keyframes float { 50% { transform: translateY(-6px); } }
@media (max-width: 900px) {
  .hero-in { grid-template-columns: minmax(0, 1fr); padding-block: 36px 40px; }
  .stage-pitch { margin-top: -10px; margin-bottom: -50px; }
}

.section { padding-block: 64px 0; }
.section-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; margin-bottom: 24px; }
.section-head h2 { font-size: clamp(24px, 3vw, 34px); font-weight: 800; margin-top: 6px; }
.features { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.feature {
  position: relative; display: flex; flex-direction: column; gap: 10px; min-height: 230px; padding: 24px; text-decoration: none; overflow: hidden;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  transition: border-color .2s, transform .2s, background .2s;
}
.feature:hover { border-color: rgba(182,255,85,.5); transform: translateY(-4px); background: var(--panel-2); }
.feature .f-ico { width: 46px; height: 46px; border-radius: 12px; background: var(--neon-soft); display: grid; place-items: center; color: var(--neon); }
.feature h3 { font-size: 22px; font-weight: 800; margin-top: auto; }
.feature p { margin: 0; color: var(--muted); }
.feature .f-go { position: absolute; top: 22px; right: 22px; color: var(--dim); transition: color .2s, transform .2s; font-size: 20px; }
.feature:hover .f-go { color: var(--neon); transform: translate(3px, -3px); }
.feature .f-art { position: absolute; right: -20px; bottom: -30px; width: 150px; height: 150px; border-radius: 50%; border: 1px solid var(--line); }
.feature .f-art::after { content: ""; position: absolute; inset: 26px; border-radius: 50%; border: 1px solid var(--line); }

.teams { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.team-tile { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.team-tile header { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.team-tile h3 { font-size: 20px; font-weight: 800; }
.team-tile .tt-desc { color: var(--muted); font-size: 13.5px; margin: 2px 0 0; }
.ovr-pill { display: flex; flex-direction: column; align-items: center; padding: 6px 12px; border-radius: 10px; background: var(--neon-soft); color: var(--neon); line-height: 1; }
.ovr-pill b { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.ovr-pill span { font-size: 9px; letter-spacing: .14em; font-weight: 700; margin-top: 3px; }
.tt-strip { display: flex; gap: 8px; }
.tt-strip > div { flex: 1; min-width: 0; --cw: 100%; }
.tt-strip .card.sm { width: 100%; --cw: 76px; }
.tt-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.chip.neon { color: var(--neon); border-color: rgba(182,255,85,.35); background: var(--neon-soft); }
.chip.warn { color: var(--warn); border-color: rgba(255,181,71,.35); }
.chip.bad { color: var(--bad); border-color: rgba(255,107,94,.35); }

.stats4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.stats4 > div { padding: 26px 24px; border-left: 1px solid var(--line); }
.stats4 > div:first-child { border-left: 0; }
.stats4 b { display: block; font-size: clamp(30px, 4vw, 46px); font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stats4 b.g { color: var(--neon); }
.stats4 span { color: var(--muted); font-weight: 600; font-size: 13.5px; }
.note { font-size: 12px; color: var(--dim); margin-top: 10px; }
@media (max-width: 900px) {
  .features, .teams { grid-template-columns: minmax(0, 1fr); }
  .stats4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats4 > div:nth-child(3) { border-left: 0; }
  .stats4 > div:nth-child(n+3) { border-top: 1px solid var(--line); }
}
.footer { margin-top: 72px; border-top: 1px solid var(--line); padding-block: 24px; color: var(--dim); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }

/* ---------- Editor ---------- */
.editor { display: grid; grid-template-columns: 290px minmax(0, 1fr) 350px; gap: 20px; align-items: start; padding-top: 24px; }
.ed-side { padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .lbl { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.input, select.input {

// ---------- Utilidades ----------

const RELATED = { GK: [], CB: ['CDM', 'LB', 'RB'], LB: ['CB', 'LW'], RB: ['CB', 'RW'], CDM: ['CM', 'CB'], CM: ['CDM', 'CAM'], CAM: ['CM', 'ST', 'LW', 'RW'], LW: ['RW', 'CAM', 'ST', 'LB'], RW: ['LW', 'CAM', 'ST', 'RB'], ST: ['CAM', 'LW', 'RW'] };
const LINE = { GK: 'def', CB: 'def', LB: 'def', RB: 'def', CDM: 'mid', CM: 'mid', CAM: 'mid', LW: 'att', RW: 'att', ST: 'att' };
function fitOf(natural, slot) { return natural === slot ? 'ok' : RELATED[natural].includes(slot) ? 'adapt' : 'off'; }
function effRating(p, slotPos) {
  const f = fitOf(p.pos, slotPos);
  if (f === 'ok') return p.ovr;
  if (f === 'adapt') return p.ovr - 4;
  return (p.pos === 'GK' || slotPos === 'GK') ? Math.max(25, p.ovr - 45) : p.ovr - 12;
}

function teamStats(t) {
  const F = FORMATIONS[t.formation];
  const lines = { att: [], mid: [], def: [] }, eff = [];
  let filled = 0;
  F.forEach(([pos], i) => {
    const p = P(t.slots[i]);
    const v = p ? effRating(p, pos) : null;
    if (p) { filled++; eff.push(v); }
    lines[LINE[pos]].push(v ?? 40);
  });
  const ovr = eff.length ? Math.round(avg(eff)) : 0;
  return { ovr, filled, att: Math.round(avg(lines.att)), mid: Math.round(avg(lines.mid)), def: Math.round(avg(lines.def)) };
}

// Reubica a los jugadores al cambiar de formación sin borrar a nadie
function remap(slots, from, to) {
  const players = slots.map((id, i) => id ? { id, i } : null).filter(Boolean);
  const T = FORMATIONS[to], out = Array(T.length).fill(null);
  const placed = new Set();
  for (const pass of ['ok', 'adapt', 'off']) {
    for (const { id } of players) {
      if (placed.has(id)) continue;
      const p = P(id);
      const k = T.findIndex(([pos], j) => !out[j] && (pass === 'off' || fitOf(p.pos, pos) === pass));
      if (k >= 0) { out[k] = id; placed.add(id); }
    }
  }
  return out;
}

// Construye automáticamente un once a partir de un filtro
function autoBuild(formation, filter, skip = 0) {
  const pool = PLAYERS.filter(filter).sort((a, b) => b.ovr - a.ovr);
  const used = new Set(), slots = [];
  FORMATIONS[formation].forEach(([pos]) => {
    const pick = cands => cands.length ? cands[Math.min(skip, cands.length - 1)] : null;
    let c = pick(pool.filter(p => !used.has(p.id) && p.pos === pos));
    if (!c) c = pick(pool.filter(p => !used.has(p.id) && fitOf(p.pos, pos) === 'adapt'));
    if (c) used.add(c.id);
    slots.push(c ? c.id : null);
  });
  return slots;
}

    const inner = p ? cardHTML(p, 'sm') : `<span class="slot-empty">+</span>`;
    const label = p ? `${pos}: ${p.name}, media ${p.ovr}${fit !== 'ok' ? ', ' + FIT_TXT[fit].toLowerCase() : ''}` : `${pos}: posición vacía`;
    const tag = interactive ? 'button' : 'div';
    const attrs = interactive ? `type="button" data-action="slot" data-i="${i}" aria-label="${esc(label)}"` : `aria-label="${esc(label)}"`;
    return `<${tag} class="${cls}" style="left:${x}%;top:${y}%" ${attrs}><span style="position:relative">${inner}${badge}</span><span class="slot-pos">${pos}</span></${tag}>`;
  }).join('');
  return `<div class="pitch">${PITCH_LINES}${slots}</div>`;
}

function barRow(label, v) { return `<div class="bar-row"><span>${label}</span><div class="bar"><i class="${barCls(v)}" style="width:${clamp((v - 30) / 69 * 100, 2, 100)}%"></i></div><b>${v || '–'}</b></div>`; }

// --- Simulador ---
function teamOptions(cur, excludeHint) {

  return `<option value="">Elige un equipo…</option>${mine ? `<optgroup label="Mis equipos">${mine}</optgroup>` : ''}<optgroup label="Plantillas FUTURE XI">${pre}</optgroup>`;
}
function vsCol(side) {
  const key = S.sim[side], t = key ? teamByKey(key) : null;
  const head = `<div class="side-tag">${side === 'home' ? 'Local' : 'Visitante'}</div><select class="input" id="sel-${side}" aria-label="Equipo ${side === 'home' ? 'local' : 'visitante'}">${teamOptions(key)}</select>`;
  if (!t) return `<div class="panel vs-col">${head}<div class="empty-state"><b>Sin equipo</b>Elige uno de tus equipos guardados o una plantilla.</div></div>`;
  const st = teamStats(t), F = FORMATIONS[t.formation];
  const roster = F.map(([pos], i) => { const p = P(t.slots[i]); return `<span><em>${pos}</em><b>${p ? esc(p.name) : '<i class="muted">Vacío</i>'}</b></span>`; }).join('');
  return `<div class="panel vs-col">${head}
    <div class="vs-team"><div><h3>${esc(t.name)}</h3><span class="small muted">${t.formation} · ${st.filled}/11 jugadores</span></div><div class="ovr-pill"><b>${st.ovr || '–'}</b><span>MEDIA</span></div></div>
    <div class="roster">${roster}</div></div>`;
}
function cmpRow(label, a, b) {
  const w = v => clamp((v - 30) / 69 * 100, 2, 100);
  return `<div class="cmp-row"><b>${a}</b><div class="bar l"><i class="${a >= b ? '' : 'low'}" style="width:${w(a)}%"></i></div><span class="lbl2">${label}</span><div class="bar"><i class="${b >= a ? '' : 'low'}" style="width:${w(b)}%"></i></div><b>${b}</b></div>`;
}
function resultHTML() {
  if (S.sim.loading) return `<div class="panel result"><div class="loading"><span class="ball"></span>Calculando el resultado...</div></div>`;
  const r = S.sim.result; if (!r) return '';
  const line = (label, a, b, suf = '') => { const tot = (a + b) || 1; return `<div class="stat-line"><b>${a}${suf}</b><div class="mid"><span>${label}</span><div class="split"><i style="flex:${a / tot}"></i><i style="flex:${b / tot}"></i></div></div><b>${b}${suf}</b></div>`; };
  const tl = r.events.length ? r.events.map(e => `<div class="tl ${e.side}"><em>${e.min}'</em><span>⚽ <b>${esc(e.name)}</b> <small>${esc(e.team)}</small></span></div>`).join('') : `<div class="empty-state">Partido sin goles.</div>`;
  return `<div class="panel result" aria-live="polite">
    <div class="eyebrow" style="text-align:center;position:relative">Match Simulator · Resultado ficticio</div>
    <div class="score"><h3>${esc(r.home)}</h3><div><div class="sc">${r.gh}<i>–</i>${r.ga}</div><span class="final">FINAL</span></div><h3>${esc(r.away)}</h3></div>
    <div class="res-grid">
      <div>${line('Posesión', r.pos[0], r.pos[1], '%')}${line('Tiros', r.shots[0], r.shots[1])}${line('Tiros a puerta', r.on[0], r.on[1])}${line('Precisión de pase', r.acc[0], r.acc[1], '%')}${line('Tarjetas amarillas', r.yel[0], r.yel[1])}</div>
      <div><div class="lbl" style="margin-bottom:10px">Goles</div><div class="timeline">${tl}</div></div>
    </div>
    <p class="disclaimer">Simulación recreativa con datos ficticios. No es una predicción de ningún partido real.</p>
  </div>`;
}
function historyHTML() {
  if (!S.history.length) return '';
  return `<div class="history"><div class="section-head"><div><div class="eyebrow">Historial</div><h2 style="font-size:22px">Últimos partidos</h2></div><button class="btn sm danger" data-action="clear-history">Borrar historial</button></div>
    <div class="panel">${S.history.slice(0, 8).map(h => `<div class="hist-row"><span class="h">${esc(h.home)}</span><span class="s">${h.gh} – ${h.ga}</span><span class="a">${esc(h.away)}</span><small>${new Date(h.date).toLocaleString('es-ES', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}</small></div>`).join('')}</div></div>`;
}
function viewSimulador() {
  const H = S.sim.home && teamByKey(S.sim.home), A = S.sim.away && teamByKey(S.sim.away);
  const hs = H ? teamStats(H) : null, as = A ? teamStats(A) : null;
  return `<div class="wrap">
    <div class="page-head"><div><div class="eyebrow">Match Simulator</div><h1>Simulador de partidos</h1><p>Elige dos equipos y genera un partido ficticio. El ataque, el centro del campo, la defensa y algo de azar deciden el marcador.</p></div></div>
    <div class="versus">${vsCol('home')}<div class="vs-mid"><div class="vs-badge">VS</div><button class="icon-btn" data-action="swap" aria-label="Intercambiar local y visitante" title="Intercambiar">⇄</button></div>${vsCol('away')}</div>
    ${hs && as ? `<div class="panel cmp"><div class="lbl" style="text-align:center">Comparativa</div>${cmpRow('Media', hs.ovr, as.ovr)}${cmpRow('Ataque', hs.att, as.att)}${cmpRow('Medio', hs.mid, as.mid)}${cmpRow('Defensa', hs.def, as.def)}</div>` : ''}
    <div class="sim-actions"><button class="btn primary" data-action="simulate" ${S.sim.loading ? 'disabled' : ''} style="padding:14px 34px;font-size:15px">Simular partido</button><div class="form-error" id="simErr" role="alert">${esc(S.sim.error)}</div></div>
    <div id="simResult">${resultHTML()}</div>
    ${historyHTML()}
  </div>${footer()}`;
}
function poisson(l) { const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; }
function weighted(items) { const tot = items.reduce((s, x) => s + x.w, 0); let r = Math.random() * tot; for (const it of items) { r -= it.w; if (r <= 0) return it; } return items[items.length - 1]; }
const SCORE_W = { ST: 6, LW: 4, RW: 4, CAM: 3, CM: 1.6, CDM: .7, LB: .5, RB: .5, CB: .5, GK: 0 };
function simulate(H, A) {
  const hs = teamStats(H), as = teamStats(A), r = Math.random;
  const lam = (att, def, mid, omid, home) => clamp(1.3 * Math.pow(att / def, 3) * Math.pow(mid / omid, 1.3) * (home ? 1.08 : 1) * (.75 + r() * .5), .15, 4.8);
  const lh = lam(hs.att, as.def, hs.mid, as.mid, true), la = lam(as.att, hs.def, as.mid, hs.mid, false);
  const gh = poisson(lh), ga = poisson(la);
  const scorers = t => FORMATIONS[t.formation].map(([pos], i) => { const p = P(t.slots[i]); return p ? { p, w: SCORE_W[pos] * Math.pow(p.a.sho / 70, 2) + .01 } : null; }).filter(Boolean);
  const events = [];
  const add = (t, n, side) => { const pool = scorers(t); for (let k = 0; k < n; k++) events.push({ side, team: t.name, name: pool.length ? weighted(pool).p.name : 'Gol en propia puerta', min: 1 + Math.floor(r() * 90) }); };
  add(H, gh, 'home'); add(A, ga, 'away');
  events.sort((a, b) => a.min - b.min);
  const ph = Math.round(clamp(50 + (hs.mid - as.mid) * 1.6 + (r() - .5) * 8, 32, 68));
  const sh = Math.max(gh, Math.round(lh * 5 + 3 + r() * 4)), sa = Math.max(ga, Math.round(la * 5 + 3 + r() * 4));
  const on = (s, g) => clamp(Math.round(s * (.3 + r() * .2)), g, s);
  const acc = s => Math.round(clamp(58 + s.mid * .32 + (r() - .5) * 4, 68, 94));
  return { home: H.name, away: A.name, gh, ga, events, pos: [ph, 100 - ph], shots: [sh, sa], on: [on(sh, gh), on(sa, ga)], acc: [acc(hs), acc(as)], yel: [Math.floor(r() * 4), Math.floor(r() * 4)] };
}
function recordResult(key, gf, ga) {
  const res = gf > ga ? 'w' : gf === ga ? 'd' : 'l';
  if (key.startsWith('u:')) {
    const t = S.teams.find(t => 'u:' + t.id === key); if (!t) return;
    t.pj = (t.pj || 0) + 1; t[res] = (t[res] || 0) + 1; t.gf = (t.gf || 0) + gf; t.ga = (t.ga || 0) + ga;
  } else {
    const id = key.slice(2), r = S.records[id] || (S.records[id] = { pj: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 });
    r.pj++; r[res]++; r.gf += gf; r.ga += ga;
  }
}
function runSim() {
  const { home, away } = S.sim;
  const err = m => { S.sim.error = m; $('#simErr').textContent = m; toast(m, true); };
  if (!home || !away) return err('Elige el equipo local y el visitante antes de simular.');
  if (home === away) return err('Un equipo no puede jugar contra sí mismo. Elige dos equipos distintos.');
  const H = teamByKey(home), A = teamByKey(away);
  for (const t of [H, A]) if (teamStats(t).filled < 7) return err(`${t.name} tiene menos de 7 jugadores. Complétalo en el editor.`);
  S.sim.error = ''; S.sim.loading = true; S.sim.result = null;
  render();
  setTimeout(() => {
    const r = simulate(H, A);
    S.sim.result = r; S.sim.loading = false;
    recordResult(home, r.gh, r.ga); recordResult(away, r.ga, r.gh);
    S.history.unshift({ date: Date.now(), home: r.home, away: r.away, gh: r.gh, ga: r.ga });
    S.history = S.history.slice(0, 30);
    store.set('fxi.history', S.history); store.set('fxi.records', S.records); saveTeams();
    if (route === 'simulador') { render(); $('#simResult')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  }, 1100);
}

// ---------- Router ----------
const ROUTES = { inicio: viewInicio, crear: viewCrear, jugadores: viewJugadores, simulador: viewSimulador, ranking: viewRanking };
let route = 'inicio';
function render() {
  const app = $('#app');
  app.innerHTML = `<div class="view">${ROUTES[route]()}</div>`;
  if (route === 'jugadores') $('#grid').innerHTML = gridHTML();
  if (route === 'crear') $('#catTarget').innerHTML = catTargetHTML();
  document.body.classList.toggle('on-crear', route === 'crear');
}
function go() {
  const r = location.hash.replace('#', '');
  const next = ROUTES[r] ? r : 'inicio';
  const changed = next !== route;
  route = next;
  if (changed) { S.activeSlot = route === 'crear' ? S.activeSlot : null; }
  render();
  document.querySelectorAll('[data-route]').forEach(a => a.classList.toggle('on', a.dataset.route === route));
  $('#nav').classList.remove('open'); $('#burger').setAttribute('aria-expanded', 'false');
  if (changed) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', go);
function navigate(r) { if (location.hash === '#' + r) go(); else location.hash = r; }

// ---------- Eventos ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a === 'modal-bg' && e.target !== el) return;
  const d = S.draft;
  switch (a) {
    case 'modal-bg': case 'close-modal': closeModal(); break;
    case 'confirm-ok': { const cb = confirmCb; confirmCb = null; closeModal(); cb && cb(); break; }
    case 'player': playerModal(el.dataset.id); break;
    case 'lineup': lineupModal(el.dataset.key); break;
    case 'add-to-team': {
      const id = el.dataset.id, p = P(id);
      closeModal();
      if (route === 'crear' && S.activeSlot != null) { placePlayer(id, S.activeSlot); break; }
      S.pending = id; S.activeSlot = null;
      if (route === 'crear') { if (isSheet()) closeSheet(); refreshEditor(); } else navigate('crear');
      toast(`Elige una posición para ${p.name}.`);
      break;
    }
    case 'slot': {
      const i = +el.dataset.i;
      if (S.pending) { placePlayer(S.pending, i); break; }
      S.activeSlot = S.activeSlot === i ? null : i;
      if (S.activeSlot != null) {
        const [pos] = FORMATIONS[d.formation][i];
        S.catPos = d.slots[i] ? 'all' : pos;
        const sel = $('#catPos'); if (sel) sel.value = S.catPos;
        if (isSheet() && !d.slots[i]) openSheet();
      }
      refreshEditor({ side: false });
      break;
    }
    case 'pick': {
      const id = el.dataset.id;
      if (S.activeSlot != null) { placePlayer(id, S.activeSlot); break; }
      S.pending = S.pending === id ? null : id;
      if (isSheet() && S.pending) closeSheet();
      refreshEditor({ side: false });
      break;
    }
    case 'cancel-pending': S.pending = null; refreshEditor({ side: false }); break;
    case 'deselect': { S.activeSlot = null; S.catPos = 'all'; const sel = $('#catPos'); if (sel) sel.value = 'all'; refreshEditor({ side: false }); break; }
    case 'remove-slot': { const p = P(d.slots[S.activeSlot]); d.slots[S.activeSlot] = null; S.activeSlot = null; saveDraft(); refreshEditor(); p && toast(`${p.name} sale del once.`); break; }
    case 'open-sheet': openSheet(); break;
    case 'close-sheet': closeSheet(); break;
    case 'load-example': { const g = PRESETS[0]; S.draft = { id: null, name: 'Galácticos XI (copia)', formation: g.formation, era: 'all', slots: [...g.slots] }; saveDraft(); refreshEditor(); toast('Ejemplo cargado. Cámbialo a tu gusto.'); break; }
    case 'save-team': {
      const name = (d.name || '').trim() || 'Mi Future XI';
      d.name = name;
      if (!d.slots.some(Boolean)) { toast('Añade al menos un jugador antes de guardar.', true); break; }
      const ex = d.id && S.teams.find(t => t.id === d.id);
      if (ex) Object.assign(ex, { name, formation: d.formation, slots: [...d.slots] });
      else { d.id = uid(); S.teams.unshift({ id: d.id, name, formation: d.formation, slots: [...d.slots], created: Date.now(), pj: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 }); }
      saveTeams(); saveDraft(); refreshEditor({ list: false });
      toast(ex ? `Cambios guardados en ${name}.` : `${name} guardado en este navegador.`);
      break;
    }
    case 'new-team': S.draft = blankDraft(); S.activeSlot = null; S.pending = null; saveDraft(); refreshEditor(); toast('Nueva plantilla en blanco.'); break;
    case 'reset-team':
      if (!d.slots.some(Boolean)) { toast('La alineación ya está vacía.'); break; }
      confirmDialog('¿Reiniciar la alineación?', 'Se quitarán los 11 jugadores del campo. El nombre y la formación se mantienen, y los equipos guardados no cambian hasta que vuelvas a guardar.', 'Reiniciar', () => {
        S.draft.slots = Array(11).fill(null); S.activeSlot = null; S.pending = null; saveDraft(); refreshEditor(); toast('Alineación reiniciada.');
      });
      break;
    case 'load-team': {
      const t = S.teams.find(t => t.id === el.dataset.id); if (!t) break;
      S.draft = { id: t.id, name: t.name, formation: t.formation, era: 'all', slots: [...t.slots] };
      S.activeSlot = null; S.pending = null; saveDraft(); refreshEditor(); toast(`${t.name} cargado.`);
      break;
    }
    case 'delete-team': {
      const t = S.teams.find(t => t.id === el.dataset.id); if (!t) break;
      confirmDialog(`¿Eliminar ${t.name}?`, 'El equipo y su historial de partidos se borrarán de este navegador. Esta acción no se puede deshacer.', 'Eliminar', () => {
        S.teams = S.teams.filter(x => x.id !== t.id); saveTeams();
        if (S.draft.id === t.id) { S.draft.id = null; saveDraft(); }
        ['home', 'away'].forEach(s => { if (S.sim[s] === 'u:' + t.id) S.sim[s] = ''; });
        refreshEditor({ list: false }); toast(`${t.name} eliminado.`);
      });
      break;
    }
    case 'use-team': {
      const t = teamByKey(el.dataset.key); if (!t) break;
      S.draft = t.preset ? { id: null, name: t.name + ' (copia)', formation: t.formation, era: 'all', slots: [...t.slots] } : { id: t.key.slice(2), name: t.name, formation: t.formation, era: 'all', slots: [...t.slots] };
      S.activeSlot = null; S.pending = null; saveDraft(); closeModal(); navigate('crear');
      break;
    }
    case 'sim-with': {
      const k = el.dataset.key;
      if (S.sim.home && S.sim.home !== k) S.sim.away = k; else S.sim.home = k;
      if (S.sim.home === S.sim.away) S.sim.away = '';
      closeModal(); navigate('simulador');
      break;
    }
    case 'swap': [S.sim.home, S.sim.away] = [S.sim.away, S.sim.home]; render(); break;
    case 'simulate': runSim(); break;
    case 'clear-history':
      confirmDialog('¿Borrar el historial?', 'Se borrará la lista de partidos recientes. Los récords de los equipos se mantienen.', 'Borrar', () => { S.history = []; store.set('fxi.history', []); render(); toast('Historial borrado.'); });
      break;
    case 'rank-tab': S.rankTab = el.dataset.tab; render(); break;
    case 'toggle-filters': $('#catSide').classList.toggle('open'); break;
    case 'reset-filters': S.pf = { q: '', pos: 'all', nat: 'all', club: 'all', era: 'all', min: 40, max: 99, tier: 'all', sort: 'ovr' }; render(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('#modalRoot').innerHTML) closeModal();
    else if ($('#edCat')?.classList.contains('open')) closeSheet();
    else if (S.pending || S.activeSlot != null) { S.pending = null; S.activeSlot = null; refreshEditor({ side: false }); }
  }
  if (e.key === 'Enter' && e.target.matches('tr[data-action]')) e.target.click();
});
document.addEventListener('input', e => {
  const id = e.target.id, v = e.target.value;
  if (id === 'teamName') { S.draft.name = v; saveDraft(); }
  else if (id === 'catQ') { S.catQ = v; $('#plist').innerHTML = catalogList(); }
  else if (id === 'fq') { S.pf.q = v; $('#grid').innerHTML = gridHTML(); }
  else if (id === 'fmin' || id === 'fmax') {
    const n = parseInt(v, 10);
    if (!isNaN(n)) { S.pf[id === 'fmin' ? 'min' : 'max'] = clamp(n, 40, 99); $('#grid').innerHTML = gridHTML(); }
  }
});
document.addEventListener('change', e => {
  const id = e.target.id, v = e.target.value;
  if (id === 'formation') {
    const from = S.draft.formation;
    S.draft.slots = remap(S.draft.slots, from, v); S.draft.formation = v; S.activeSlot = null; saveDraft(); refreshEditor();
    toast(`Formación ${v}. Jugadores recolocados.`);
  } else if (id === 'eraSel') { S.draft.era = v; saveDraft(); refreshEditor({ side: false }); }
  else if (id === 'catPos') { S.catPos = v; $('#plist').innerHTML = catalogList(); }
  else if (id === 'catSort') { S.catSort = v; $('#plist').innerHTML = catalogList(); }
  else if (id === 'teamName') { refreshEditor({ list: false }); }
  else if (['fpos', 'fnat', 'fclub', 'fera', 'ftier', 'fsort'].includes(id)) { S.pf[id.slice(1)] = v; $('#grid').innerHTML = gridHTML(); }
  else if (id === 'sel-home' || id === 'sel-away') { S.sim[id.slice(4)] = v; S.sim.error = ''; render(); }
});
$('#burger').addEventListener('click', () => { const open = $('#nav').classList.toggle('open'); $('#burger').setAttribute('aria-expanded', String(open)); });

// Arranque
S.sim.home = 'p:galacticos'; S.sim.away = 'p:legends';
go();
</script>
</body>
</html>
